<?xml version="1.0"?>
<!-- evaders/stealth/android-fonts — a fontconfig mask presenting an Android-coherent web-measurable font set. -->
<!-- Rejects the desktop-Linux SIGNATURE fonts (DejaVu/Liberation/croscore/Free) a real Pixel never ships, so the
     collector's font-OS probe drops below its 2-signature-font Linux threshold (only Noto remains, which Android
     also ships) — clearing br.font_os_vs_ua + br.font_linux_leak under an Android UA. Enabled by KS_ANDROID_FONTS. -->
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>DejaVu Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Sans Narrow</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Arimo</string></patelt></pattern>
      <pattern><patelt name="family"><string>Cousine</string></patelt></pattern>
      <pattern><patelt name="family"><string>Tinos</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSans</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSerif</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeMono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Ubuntu</string></patelt></pattern>
      <pattern><patelt name="family"><string>Cantarell</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
