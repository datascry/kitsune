# harness/examples/objective-credential-stuffing — a coordinated fleet DRIVING an objective with sharded work.
# Each of the N workers gets a DISTINCT batch of the synthetic credential set; the fleet covers it collectively.
#
# ETHICS: synthetic, lab-only — the credentials are example.test fabrications and the target is Kitsune's OWN
# edge/form (the allow-list). This MODELS a cred-stuffing fleet to measure coordination detection, never a real
# target or real auth. Run (spine up):
#   task coordination-fleet-manage -- --plan examples/objective-credential-stuffing.yaml --detector http://localhost:8099
edge: https://edge:8443/
worker_detector: http://detector:8080
nodes:
  # 3 zendriver workers, each typing its own shard of the credential set (worker i -> creds[i::3]).
  - evasion: zendriver-uach
    replicas: 3
    objective: credential-stuffing
