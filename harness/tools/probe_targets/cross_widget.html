<!doctype html>
<!-- harness/tools/probe_targets/cross_widget — stand-in for a CROSS-ORIGIN widget + host-page noise.
     Embeds the fingerprinting child from a different origin (:8001) and fires an analytics-style beacon, to ground
     the diff's challenge-frame scoping + noise filter. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cross-origin widget stand-in</title>
  </head>
  <body>
    <p>verifying…</p>
    <iframe src="http://127.0.0.1:8001/probe_targets/iframe_inner.html" width="300" height="65" title="challenge"></iframe>
    <script>
      // host-page noise the filter should drop: an analytics-style beacon on the host origin
      try {
        fetch("/cdn-cgi/rum?probe", { method: "POST", body: JSON.stringify({ st: 1 }) }).catch(() => {});
      } catch (_) {}
    </script>
  </body>
</html>
