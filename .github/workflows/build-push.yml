# .github/workflows/build-push — publish the detector + edge + arena images to GHCR on each release.
# Pull-based CD (Option B): a release triggers this build; the VPS's Watchtower auto-pulls the new images.

name: build-push
on:
  release:
    types: [published] # release-please publishes the GitHub Release when its release PR is merged
  workflow_dispatch: {}

# Minimal top-level token; only the images job is granted packages:write (Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: detector
            context: "."
            dockerfile: detector/Dockerfile
          - service: edge
            context: ./edge
            dockerfile: edge/Dockerfile
          - service: arena
            context: "."
            dockerfile: arena/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kitsune-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
